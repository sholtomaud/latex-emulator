name: Update visual baselines

# Regenerates Playwright toHaveScreenshot baselines in the pinned container and
# commits them to the selected branch. Use after an intentional visual change
# when you can't run `npm run e2e:visual:update` locally (it needs Docker).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pw
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/g, '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Regenerate snapshots in the pinned Playwright image
        run: |
          docker run --rm --ipc=host -v "$PWD":/work -w /work \
            mcr.microsoft.com/playwright:v${{ steps.pw.outputs.version }}-noble \
            sh -c "npm ci && npx playwright test --project=visual --update-snapshots"
      - name: Commit changed baselines
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Update visual baselines"
            git push
          fi
