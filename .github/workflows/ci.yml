name: CI

on:
  pull_request:
    branches: [main]
  # Pushes to main run this via deploy.yml, which gates the Pages deploy on it.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (typecheck, lint, node --test + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit
      - run: npm run test:coverage
      - run: npm run build

  latex-projects:
    name: LaTeX projects (pdflatex + bibtex)
    runs-on: ubuntu-latest
    # The folders "Download project (.zip)" makes must compile in real
    # pdflatex (ADR 0015). Only src/ TypeScript runs, so no npm ci.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.x
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra texlive-science \
            texlive-publishers \
            lmodern
      - run: npm run check:projects

  zotero:
    name: Zotero plugin in a real Zotero
    runs-on: ubuntu-latest
    # The plugin (ADR 0024) installed into a clean profile of a real Zotero,
    # started headless, and driven over HTTP: pairing tokens, the read
    # tools, CORS and the refusals. Bump ZOTERO_VERSION deliberately, with
    # zotero-plugin/plugin.json's version range.
    env:
      ZOTERO_VERSION: 10.0.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.x
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1
      - name: Download Zotero ${{ env.ZOTERO_VERSION }}
        run: |
          curl -fsSL -o zotero.tar.xz \
            "https://download.zotero.org/client/release/${ZOTERO_VERSION}/Zotero-${ZOTERO_VERSION}_linux-x86_64.tar.xz"
          mkdir -p "$RUNNER_TEMP/zotero"
          tar -xJf zotero.tar.xz -C "$RUNNER_TEMP/zotero"
      - run: npm run test:zotero
        env:
          ZOTERO_DIR: ${{ runner.temp }}/zotero/Zotero_linux-x86_64
          ZOTERO_LOG: ${{ runner.temp }}/zotero.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zotero-log
          path: ${{ runner.temp }}/zotero.log

  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: get
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/g, '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  playwright:
    name: Playwright (${{ matrix.suite }})
    needs: playwright-version
    runs-on: ubuntu-latest
    # The pinned image gives every suite (and visual baselines) the same
    # Chromium build and fonts as `npm run e2e:visual` locally.
    container: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: smoke
            projects: --project=smoke
          - suite: e2e
            projects: --project=functional-dev --project=functional-prod
          - suite: visual
            projects: --project=visual
          - suite: pages
            projects: --project=pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.x
          cache: npm
      - run: npm ci
      - run: npx playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
