<aside class="assistant" aria-labelledby="assistant-title">
  <header class="assistant-header">
    <h2 class="assistant-title" id="assistant-title">Assistant</h2>
    <button
      type="button"
      class="assistant-close"
      aria-label="Close assistant"
      title="Close (Ctrl/⌘ Alt B)"
    >
      <span aria-hidden="true">×</span>
    </button>
  </header>
  <div class="assistant-empty">
    <p>The writing assistant is on its way.</p>
    <ul>
      <li>
        Instant checks against a style profile as you type, with no model and
        nothing sent anywhere.
      </li>
      <li>
        Paragraph checks by a model you choose, local or cloud, when you pause.
      </li>
      <li>Audits of a section’s flow and an argument’s logic, on request.</li>
    </ul>
  </div>
</aside>
