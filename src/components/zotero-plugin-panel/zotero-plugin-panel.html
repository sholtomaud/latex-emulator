<section class="zotero-plugin" aria-label="Zotero plugin">
  <p class="zp-intro">
    Our Zotero plugin lets this app, and AI agents such as Claude Code, search
    the Zotero on this computer.
  </p>
  <ol class="zp-steps">
    <li>
      <a class="zp-get" download="latex-emulator-zotero.xpi" href=""
        >Get the Zotero plugin</a
      >
    </li>
    <li>
      In Zotero (version 10): Tools → Plugins → ⚙ → Install Plugin From File…,
      and choose the downloaded file.
    </li>
    <li>Connect, then allow it in Zotero.</li>
  </ol>
  <p class="zp-status" role="status"></p>
  <label class="zp-remember">
    <input type="checkbox" class="zp-remember-input" />
    Remember this connection on this device (stored encrypted)
  </label>
  <div class="zp-actions">
    <button type="button" class="zp-connect">Connect</button>
    <button type="button" class="zp-disconnect" hidden>Disconnect</button>
  </div>
</section>
