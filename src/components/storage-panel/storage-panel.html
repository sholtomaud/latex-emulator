<section class="storage" aria-label="Storage">
  <div class="explorer-header">
    <h2 class="explorer-title">Storage</h2>
  </div>
  <p class="storage-health">
    <span class="storage-where">Stored in this browser only.</span>
    <span class="storage-protection"></span>
    <span class="storage-usage"></span>
    <span class="storage-backup"></span>
  </p>
  <div class="storage-actions">
    <button
      type="button"
      class="storage-button backup-all"
      title="Download every document, version, .bib file and image as one .zip"
    >
      Back up all
    </button>
    <button
      type="button"
      class="storage-button restore"
      title="Merge a backup into this browser: the newer copy of each item is kept"
    >
      Restore…
    </button>
    <input
      class="restore-input"
      type="file"
      accept=".zip,application/zip"
      hidden
    />
  </div>
  <p class="storage-status" role="status"></p>
  <div class="folder" aria-label="This document’s folder" role="group">
    <h3 class="storage-subtitle">This document’s folder</h3>
    <p class="folder-unsupported" hidden>
      Saving to a folder needs Chrome or Edge. Use Download .zip instead.
    </p>
    <div class="folder-controls">
      <p class="folder-where"></p>
      <div class="storage-actions">
        <button
          type="button"
          class="storage-button folder-save"
          title="Save this document’s project folder (.tex, .bib files, images) on this computer. A folder synced by OneDrive or Google Drive puts it in the cloud too."
        >
          Save to folder…
        </button>
        <button
          type="button"
          class="storage-button folder-open"
          title="Open a LaTeX project folder as a new document"
        >
          Open folder…
        </button>
      </div>
      <div class="storage-actions folder-conflict" hidden>
        <button type="button" class="storage-button folder-overwrite">
          Overwrite
        </button>
        <button type="button" class="storage-button folder-cancel">
          Cancel
        </button>
      </div>
      <label class="folder-auto" hidden>
        <input type="checkbox" class="folder-auto-input" />
        Save there as I type
      </label>
      <button type="button" class="link-button folder-unlink" hidden>
        Stop saving to this folder
      </button>
      <p class="folder-status" role="status"></p>
    </div>
  </div>
</section>
