<div class="shell">
  <header class="toolbar">
    <h1 class="brand">LaTeX Emulator</h1>
    <button type="button" class="print-button" title="Download PDF (Ctrl/⌘ P)">
      Download PDF
    </button>
  </header>
  <main class="panes">
    <section class="pane" aria-label="LaTeX source">
      <latex-editor></latex-editor>
    </section>
    <section class="pane pane-preview" aria-label="Document preview">
      <latex-preview></latex-preview>
    </section>
  </main>
</div>
