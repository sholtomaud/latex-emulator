<div class="shell">
  <header class="toolbar">
    <button
      type="button"
      class="toolbar-icon explorer-toggle"
      aria-label="Toggle documents"
      aria-controls="explorer"
      aria-expanded="false"
      title="Documents (Ctrl/⌘ B)"
    >
      <span aria-hidden="true">☰</span>
    </button>
    <h1 class="brand">LaTeX Emulator</h1>
    <span class="doc-name" aria-live="polite"></span>
    <div class="toolbar-actions">
      <download-menu></download-menu>
    </div>
  </header>
  <p class="app-notice" role="alert" hidden></p>
  <p class="app-update" role="status" hidden>
    A new version of LaTeX Emulator is ready.
    <button type="button" class="app-update-button">Reload</button>
  </p>
  <main class="panes">
    <activity-bar></activity-bar>
    <document-explorer id="explorer" hidden></document-explorer>
    <section class="pane" aria-label="LaTeX source">
      <latex-editor></latex-editor>
    </section>
    <section class="pane pane-preview" aria-label="Document preview">
      <latex-preview></latex-preview>
    </section>
    <assistant-panel id="assistant" hidden></assistant-panel>
  </main>
</div>
