<div class="shell">
  <header class="toolbar">
    <button
      type="button"
      class="toolbar-icon explorer-toggle"
      aria-label="Toggle documents"
      aria-controls="explorer"
      aria-expanded="false"
      title="Documents (Ctrl/⌘ B)"
    >
      <span aria-hidden="true">☰</span>
    </button>
    <h1 class="brand">LaTeX Emulator</h1>
    <span class="doc-name" aria-live="polite"></span>
    <div class="toolbar-actions">
      <button
        type="button"
        class="toolbar-button tex-button"
        title="Download the LaTeX source"
        aria-label="Download .tex"
      >
        <span class="label-prefix">Download </span>.tex
      </button>
      <button
        type="button"
        class="toolbar-button preprint-button"
        title="Save a version and download it as a stamped preprint PDF"
        aria-label="Download Preprint"
      >
        <span class="label-prefix">Download </span>Preprint
      </button>
      <button
        type="button"
        class="toolbar-button primary print-button"
        title="Download PDF (Ctrl/⌘ P)"
        aria-label="Download PDF"
      >
        <span class="label-prefix">Download </span>PDF
      </button>
    </div>
  </header>
  <main class="panes">
    <document-explorer id="explorer" hidden></document-explorer>
    <section class="pane" aria-label="LaTeX source">
      <latex-editor></latex-editor>
    </section>
    <section class="pane pane-preview" aria-label="Document preview">
      <latex-preview></latex-preview>
    </section>
  </main>
</div>
